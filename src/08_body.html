</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<div class="ambient" id="ambient" aria-hidden="true"></div>
<div class="pegel" id="pegel" aria-hidden="true">
  <div class="pegel__fill"><i class="unter"></i><i class="ueber"></i><div class="pegel__edge"><b></b></div></div>
  <div class="pegel__ziel"><span>Target</span></div>
</div>

<!-- start -->
<section class="start on" id="start">
  <div class="startkarte">
    <div class="marke">
      <div class="app-icon" data-icon></div>
      <div>
        <h1>CICO</h1>
        <p class="lead">Calories in, calories out. Scan it once, know it forever. Everything stays on this device and in your own data file.</p>
      </div>
    </div>
    <div class="wahl" id="wahl"></div>
    <p class="startfuss" id="startfuss"></p>
    <div class="startlook" id="startLook"><span class="row-label">Look</span></div>
  </div>
</section>

<!-- app -->
<div class="app" id="shell" hidden>
  <header class="app-header">
    <div class="wrap">
      <div class="app-id">
        <div class="app-icon" data-icon></div>
        <div class="app-title"><b>CICO</b><small id="dateiname"></small></div>
      </div>
      <div class="header-actions">
        <button type="button" class="btn btn--ghost btn--sm only-desktop" id="ordner" hidden title="App folder and backup folder: today's file goes into the app folder, the one it replaces into the backup folder">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="btn__label">Save to folder</span></button>
        <button type="button" class="btn btn--secondary btn--sm save" id="sichern"><span class="ring"></span><span class="dot"></span><span class="btn__label">Saved</span></button>
        <button type="button" class="btn btn--ghost btn--sm btn--icon" id="einstellungen" aria-label="Targets and settings" title="Targets and settings">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main class="wrap" id="main">
    <section class="seite" id="p-overview" aria-label="Overview"></section>
    <section class="seite" id="p-entry" aria-label="Entry"></section>
    <section class="seite" id="p-foods" aria-label="Foods"></section>
  </main>
  <!-- pages: one round button at the bottom right, the pages open above it along the right edge -->
  <nav class="seitenwahl" id="tabs" aria-label="Pages">
    <div class="seitenwahl__schleier"></div>
    <div class="seitenwahl__liste" id="seitenliste"></div>
    <button type="button" class="seitenwahl__knopf" id="seitenknopf" aria-expanded="false" aria-controls="seitenliste" aria-label="Pages"></button>
  </nav>
</div>

<div id="dlgroot"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<input type="file" id="dateiwahl" accept=".json,application/json" hidden>
<input type="file" id="kamera" accept="image/*" capture="environment" hidden>
<input type="file" id="fotowahl" accept="image/*" hidden>
