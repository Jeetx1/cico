:root[data-theme="glass"]{
  --color-scheme:dark;

  /* colour: surfaces */
  --bg:#070B10;
  --bg-image:radial-gradient(120% 70% at 50% -10%,#10202F 0%,rgba(16,32,47,0) 60%),radial-gradient(80% 60% at 100% 100%,rgba(47,94,145,.16),rgba(47,94,145,0) 70%);
  --surface:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));
  --surface-solid:#111A23;
  --surface-raised:linear-gradient(180deg,rgba(34,46,60,.9),rgba(18,26,35,.94));
  --group-bg:var(--surface);
  --border:rgba(255,255,255,.11);
  --border-strong:rgba(255,255,255,.2);
  --hairline:rgba(255,255,255,.06);
  --neutral-soft:rgba(255,255,255,.08);
  --row-hover:rgba(255,255,255,.05);

  /* colour: text */
  --text:#F1F6FA; --text-2:#A9B7C4; --text-3:#6E7D8B; --text-4:#4A5662;
  --eyebrow:#7DB1E6;

  /* colour: accent and states */
  --accent:#7DB1E6; --accent-text:#C9DDF5; --accent-soft:rgba(125,177,230,.15);
  --primary-bg:linear-gradient(180deg,#DCEBFA,#A9CDF3); --primary-text:#08131E;
  --primary-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 10px 26px -14px rgba(125,177,230,.75);
  --secondary-bg:rgba(255,255,255,.09); --secondary-text:#F1F6FA; --secondary-border:rgba(255,255,255,.12);
  --btn-hover-overlay:rgba(255,255,255,.1);

  --danger-soft:rgba(224,122,114,.14); --danger-line:rgba(224,122,114,.35); --danger-shadow:inset 0 1px 0 rgba(255,255,255,.18);
  --success:#86D4C4; --success-soft:rgba(134,212,196,.14);
  --warning:#E39A12; --warning-deep:#C27F06; --warning-on:#1B1203; --warning-glow:rgba(227,154,18,.45);
  --focus:#7DB1E6; --focus-ring:rgba(125,177,230,.2); --selection:rgba(125,177,230,.35);

/* =====================================================================

   Nothing here names a colour, font, radius or shadow directly, so a
   tool changes theme by swapping the token block + effects module.
   Runtime-only variables: --i, --n (indicator position), --p (progress),
   --sat/--sab (safe areas).

*{box-sizing:border-box}
html,body{margin:0;padding:0}

body{color:var(--text);font:var(--fs-body)/1.5 var(--font-ui);letter-spacing:var(--ls-body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}

button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
input,select,textarea{-webkit-appearance:none;appearance:none}
[hidden]{display:none!important}
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
::selection{background:var(--selection)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  -webkit-backdrop-filter:var(--header-blur);backdrop-filter:var(--header-blur)}

  background:var(--tabs-bg);border:var(--bw) solid var(--tabs-border);box-shadow:var(--tabs-shadow);-webkit-backdrop-filter:var(--backdrop);backdrop-filter:var(--backdrop)}

  transform:translateX(calc(var(--i,0) * 100%));transition:transform var(--dur-slow) var(--ease-spring);pointer-events:none}

.chip--filter{height:34px;padding:0 14px;font-size:13px;border:var(--bw) solid var(--border);background:var(--field-bg);transition:background var(--dur-fast),color var(--dur-fast),transform var(--dur) var(--ease-spring)}

.btn{--h:var(--btn-h);position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h);padding:0 var(--btn-pad);
  border-radius:var(--r-btn);border:var(--bw) solid transparent;font-size:var(--fs-btn);font-weight:var(--fw-btn);letter-spacing:var(--ls-btn);text-transform:var(--btn-case);white-space:nowrap;

.chart-tip b{font-weight:700}
.chart-tip span{color:var(--text-3)}
.legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend i.dash{height:0;width:14px;border-radius:0;border-top:2px dashed}
.donut{display:grid;gap:20px;justify-items:center}
.donut__ring{position:relative;aspect-ratio:1/1;width:100%;max-width:184px}
.donut__ring svg{width:100%;height:100%;display:block;animation:donutIn var(--dur-chart) var(--ease) both}
.donut__ring .seg{fill:none;transform-box:view-box;transform-origin:50% 50%;transition:transform var(--dur) var(--ease-spring),opacity var(--dur-fast);cursor:pointer}
.donut__ring.is-hover .seg{opacity:.35}
.donut__ring.is-hover .seg.on{opacity:1;transform:scale(1.045)}
.donut__mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut__mid b{display:block;font-family:var(--font-num);font-size:23px;font-weight:var(--fw-num);letter-spacing:var(--ls-num);line-height:1.1}
.donut__mid small{display:block;font-size:11.5px;color:var(--text-3)}
.donut__list{display:grid;gap:4px;font-size:13px;min-width:0;width:100%}
.donut__list div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:9px;align-items:center;padding:3px 6px;margin:0 -6px;border-radius:8px;transition:background var(--dur-fast)}
.donut__list div.on{background:var(--row-hover)}
.donut__list i{width:10px;height:10px;border-radius:3px}
.donut__list span{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut__list b{font-family:var(--font-num-table);font-variant-numeric:tabular-nums;font-weight:600}
@keyframes donutIn{from{opacity:0;transform:rotate(-40deg) scale(.92)}}

/* ---------------------------------------------------------------- dropdown menu (computers; the iPhone keeps its native picker) */
.select.is-open{border-color:var(--focus)}
.menu{position:fixed;z-index:140;min-width:160px;overflow:auto;overscroll-behavior:contain;padding:6px;border-radius:var(--r-menu);background:var(--menu-bg);
  border:var(--bw) solid var(--border);box-shadow:var(--shadow-pop);-webkit-backdrop-filter:var(--backdrop);backdrop-filter:var(--backdrop);
  transform-origin:50% 0;animation:menuIn var(--dur) var(--ease-spring) both;scrollbar-width:thin}
.menu.is-up{transform-origin:50% 100%;animation-name:menuInUp}
.menu.is-closing{animation:menuOut .15s var(--ease) forwards;pointer-events:none}
.menu__item{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:36px;padding:0 10px 0 12px;border-radius:var(--r-menu-item);
  font-size:14px;color:var(--text);text-align:left;white-space:nowrap;transition:background var(--dur-fast)}
.menu__item:hover,.menu__item:focus{background:var(--neutral-soft);outline:none}
.menu__item:focus-visible{box-shadow:inset 0 0 0 1.5px var(--focus)}
.menu__item i{display:flex;color:var(--accent);opacity:0}
.menu__item.is-selected{font-weight:600}
.menu__item.is-selected i{opacity:1}
.menu__item:disabled{color:var(--text-4);cursor:default;background:none}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
@keyframes menuInUp{from{opacity:0;transform:translateY(6px) scale(.97)}}
@keyframes menuOut{to{opacity:0;transform:scale(.98)}}

/* ---------------------------------------------------------------- data table */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .search{flex:1 1 220px;max-width:360px}
.table-wrap{max-height:420px;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-inner);border:var(--bw) solid var(--table-border);background:var(--table-bg);overscroll-behavior:contain}
.table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.table th{position:sticky;top:0;z-index:2;background:var(--table-head-bg);text-align:left;padding:0;border-bottom:var(--bw) solid var(--border-strong);white-space:nowrap;
  -webkit-backdrop-filter:var(--header-blur);backdrop-filter:var(--header-blur)}
.th-sort{display:flex;align-items:center;gap:6px;width:100%;padding:11px 14px;color:var(--th-text);font-size:var(--th-size);font-weight:var(--th-weight);letter-spacing:var(--th-spacing);text-transform:var(--th-case)}
.th-sort:hover{color:var(--text)}
.th-sort svg{opacity:.3;transition:transform var(--dur) var(--ease-spring),opacity var(--dur-fast)}
th[aria-sort] .th-sort{color:var(--text)}
th[aria-sort] .th-sort svg{opacity:1;color:var(--accent)}
th[aria-sort=descending] .th-sort svg{transform:rotate(180deg)}
th.num .th-sort{justify-content:flex-end}
.table td{padding:11px 14px;border-bottom:var(--bw) solid var(--hairline);white-space:nowrap}
.table td.wrap-ok{white-space:normal;min-width:180px}
.table tbody tr{transition:background var(--dur-fast)}
.table tbody tr:hover{background:var(--row-hover)}
.table tbody tr:last-child td{border-bottom:0}
.table td.num,.table th.num{text-align:right}
.table td.num{font-family:var(--font-num-table);font-variant-numeric:tabular-nums;font-weight:600}
.table tr.is-new{animation:rowNew 1.4s var(--ease)}
@keyframes rowNew{0%{background:var(--accent-soft)}100%{background:transparent}}
.table-foot{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:12.5px;color:var(--text-3)}

/* ---------------------------------------------------------------- collapsible groups */
.groups{display:grid;gap:var(--group-gap)}
.group{background:var(--group-bg);border:var(--bw) solid var(--border);border-radius:var(--r-group);overflow:hidden;box-shadow:var(--shadow-group);
  -webkit-backdrop-filter:var(--backdrop);backdrop-filter:var(--backdrop)}
.group__head{display:flex;align-items:center;gap:14px;width:100%;padding:15px 18px;text-align:left;transition:background var(--dur-fast)}
.group__head:hover{background:var(--row-hover)}
.chev{width:8px;height:8px;flex:none;border-right:1.7px solid var(--text-3);border-bottom:1.7px solid var(--text-3);transform:rotate(-45deg);transition:transform var(--dur-slow) var(--ease-spring)}
.group.is-open .chev{transform:rotate(45deg)}
.group__title{font-weight:var(--fw-strong);font-size:15px;flex:1;min-width:0}
.group__meta{font-size:12.5px;color:var(--text-3);white-space:nowrap}
.group__sum{font-family:var(--font-num-table);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;min-width:86px;text-align:right}
.group__body{display:none;border-top:var(--bw) solid var(--hairline)}
.group.is-open .group__body{display:block}
.group.is-open .group__body > *{animation:groupIn var(--dur-slow) var(--ease) both}
.group.is-open .group__body > :nth-child(2){animation-delay:30ms}
.group.is-open .group__body > :nth-child(3){animation-delay:60ms}
.group.is-open .group__body > :nth-child(4){animation-delay:90ms}
.group__row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 18px 11px 40px;font-size:13.5px}
.group__row + .group__row{border-top:var(--bw) solid var(--hairline)}
.group__row .d{color:var(--text-3);font-size:12.5px;font-variant-numeric:tabular-nums}
.group__row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group__row .a{font-family:var(--font-num-table);font-variant-numeric:tabular-nums;font-weight:600}
@keyframes groupIn{from{opacity:0;transform:translateY(-6px)}}

/* ---------------------------------------------------------------- forms */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 18px}
.form-grid .full{grid-column:1/-1}
.field{display:grid;gap:7px;min-width:0;align-content:start}
.field__label{display:flex;justify-content:space-between;gap:8px;font-size:var(--field-label-size);font-weight:var(--field-label-weight);color:var(--field-label);
  letter-spacing:var(--field-label-spacing);text-transform:var(--field-label-case)}
.field__label small{font-weight:500;color:var(--text-3);text-transform:none;letter-spacing:0}
.field__hint{font-size:12px;color:var(--text-3)}
.field__msg{font-size:12.5px;color:var(--danger);display:none;align-items:center;gap:6px}
.field.is-error .field__msg{display:flex}
.input,.select,.textarea{width:100%;height:var(--field-h);padding:0 14px;border-radius:var(--r-control);border:var(--bw) solid var(--field-border);background:var(--field-bg);
  color:var(--text);font-size:15px;outline:none;box-shadow:var(--field-shadow);transition:border-color var(--dur-fast),background var(--dur-fast)}
.textarea{height:auto;min-height:96px;padding:12px 14px;line-height:1.5;resize:vertical}
.input::placeholder,.textarea::placeholder{color:var(--text-4)}
.input:hover,.select:hover,.textarea:hover{border-color:var(--field-border-hover)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--focus);background:var(--field-bg-focus);box-shadow:0 0 0 3px var(--focus-ring)}
.field.is-error .input{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.select-wrap{position:relative}
.select-wrap::after{content:"";position:absolute;right:15px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:1.6px solid var(--text-2);border-bottom:1.6px solid var(--text-2);transform:rotate(45deg);pointer-events:none}
.select{padding-right:38px;cursor:pointer}
.select option{background:var(--surface-solid);color:var(--text)}
.select--pill{height:36px;border-radius:var(--r-seg);font-size:13.5px;font-weight:600;padding-left:14px}
.input[type=date]{min-height:var(--field-h);line-height:var(--field-h)}
.input[type=date]::-webkit-date-and-time-value{text-align:left}
.input[type=date]::-webkit-calendar-picker-indicator{opacity:.6;cursor:pointer;filter:var(--picker-filter)}
.affix{position:relative}
.affix .input{padding-right:52px}
.affix em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--text-3);pointer-events:none}
.affix--left .input{padding-left:40px;padding-right:14px}
.affix--left em,.affix--left svg{left:14px;right:auto}
.affix svg{position:absolute;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.input.num{text-align:right}

.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer;padding:6px 0}
.switch span b{display:block;font-weight:600;font-size:14px}
.switch span small{display:block;font-size:12.5px;color:var(--text-3)}
.switch input{position:relative;width:46px;height:28px;flex:none;border-radius:999px;background:var(--switch-off);cursor:pointer;border:0;transition:background var(--dur) var(--ease)}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--switch-knob);box-shadow:var(--switch-knob-shadow);transition:transform var(--dur-slow) var(--ease-spring)}
.switch input:checked{background:var(--switch-on)}
.switch input:checked::after{transform:translateX(18px)}
.switch--sm input{width:38px;height:22px}
.switch--sm input::after{width:16px;height:16px}
.switch--sm input:checked::after{transform:translateX(16px)}

.check{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.check input{width:20px;height:20px;flex:none;border-radius:var(--r-check);border:1.5px solid var(--border-strong);background:var(--field-bg);display:grid;place-items:center;cursor:pointer;
  transition:background var(--dur-fast),border-color var(--dur-fast)}
.check input::after{content:"";width:5px;height:10px;border:solid var(--check-mark);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg) scale(0);transition:transform var(--dur) var(--ease-spring)}
.check input:checked{background:var(--switch-on);border-color:var(--switch-on)}
.check input:checked::after{transform:translateY(-1px) rotate(45deg) scale(1)}

/* segmented control (also the Period/YTD toggle): equal cells, thumb moves with translateX */
.segmented{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:var(--r-seg);background:var(--seg-bg);border:var(--bw) solid var(--border)}
.segmented button{position:relative;z-index:1;height:30px;padding:0 15px;border-radius:var(--r-seg-in);font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:var(--ls-tab);transition:color var(--dur) var(--ease);white-space:nowrap}
.segmented button.is-active{color:var(--seg-active-text)}
.segmented__thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n,2));border-radius:var(--r-seg-in);background:var(--seg-active-bg);box-shadow:var(--seg-active-shadow);
  transform:translateX(calc(var(--i,0) * 100%));transition:transform var(--dur-slow) var(--ease-spring)}
.segmented--block{display:grid;width:100%}
.period{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------------------------------------------------------------- overlay: modal, warning dialog, sheet */
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--overlay);
  -webkit-backdrop-filter:var(--overlay-blur);backdrop-filter:var(--overlay-blur);animation:fadeIn var(--dur) ease both}
.modal{position:relative;width:100%;max-width:480px;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;padding:var(--pad-modal);background:var(--surface-raised);
  border:var(--bw) solid var(--border);border-radius:var(--r-modal);box-shadow:var(--shadow-pop);-webkit-backdrop-filter:var(--backdrop);backdrop-filter:var(--backdrop);
  animation:modalIn var(--dur-slow) var(--ease-spring) both}
.modal__grip{display:none;width:38px;height:5px;border-radius:5px;background:var(--border-strong);margin:-8px auto 14px}
.modal__head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.modal__head > div:not(.modal__icon){flex:1;min-width:0}
.modal__title{margin:0;font-family:var(--font-display);font-weight:var(--fw-display);font-size:var(--fs-modal-title);letter-spacing:var(--ls-display);line-height:1.15}
.modal__text{margin:6px 0 0;color:var(--text-2);font-size:14px}
.modal__icon{width:44px;height:44px;flex:none;border-radius:var(--r-icon);display:grid;place-items:center;background:var(--danger-soft);color:var(--danger)}
.modal__close{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--text-2);background:var(--neutral-soft);transition:transform var(--dur) var(--ease-spring)}
.modal__close:active{transform:scale(.9)}
.modal__actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:24px}
.modal__actions .spacer{flex:1}
.callout{padding:11px 13px;border-radius:var(--r-control);font-size:13px;line-height:1.5;background:var(--danger-soft);color:var(--text);border:var(--bw) solid var(--danger-line)}
.overlay.is-closing{animation:fadeOut var(--dur) ease forwards}
.overlay.is-closing .modal{animation:modalOut var(--dur) var(--ease) forwards}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes modalOut{to{opacity:0;transform:translateY(10px) scale(.98)}}

/* ---------------------------------------------------------------- toasts */
.toasts{position:fixed;left:50%;bottom:calc(24px + var(--sab));z-index:120;width:min(92vw,440px);transform:translateX(-50%);display:grid;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:12px;padding:12px 14px 12px 16px;border-radius:var(--r-toast);background:var(--toast-bg);color:var(--toast-text);
  border:var(--bw) solid var(--border);box-shadow:var(--shadow-pop);-webkit-backdrop-filter:var(--backdrop);backdrop-filter:var(--backdrop);font-size:14px;line-height:1.4;
  animation:toastIn var(--dur-slow) var(--ease-spring) both}
.toast__icon{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;margin-top:-1px}
.toast--success .toast__icon{background:var(--success-soft);color:var(--success)}
.toast--info .toast__icon{background:var(--accent-soft);color:var(--accent)}
.toast--error .toast__icon{background:var(--danger-soft);color:var(--danger)}
.toast--error{border-color:var(--danger-line)}
.toast__body{flex:1;min-width:0}
.toast__body small{display:block;color:var(--text-3);font-size:12.5px;margin-top:1px}
.toast__action{font-weight:700;color:var(--toast-action);font-size:13.5px;padding:2px 2px;flex:none}
.toast.is-leaving{animation:toastOut var(--dur) var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.98)}}

/* ---------------------------------------------------------------- empty + loading */
.empty{display:grid;justify-items:center;text-align:center;gap:8px;padding:28px 12px}
.empty__art{width:72px;height:72px;border-radius:var(--r-empty-art);display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
.empty__title{margin:0;font-family:var(--font-display);font-weight:var(--fw-display);font-size:var(--fs-empty-title);letter-spacing:var(--ls-display)}
.empty__text{margin:0 0 8px;color:var(--text-3);max-width:34ch;font-size:13.5px}
.spinner{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--spinner-track);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
.spinner--sm{width:18px;height:18px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-line{display:flex;align-items:center;gap:12px;color:var(--text-2);font-size:13.5px}
.skel{display:grid;gap:14px}
.skel__row{display:grid;grid-template-columns:36px 1fr 70px;gap:12px;align-items:center}
.skeleton{position:relative;overflow:hidden;height:12px;border-radius:var(--r-skel);background:var(--skeleton)}
.skeleton--c{width:36px;height:36px;border-radius:var(--r-icon)}
.skeleton::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--skeleton-shine),transparent);transform:translateX(-100%);animation:shimmer 1.5s ease-in-out infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.progress{position:relative;height:6px;border-radius:6px;background:var(--progress-track);overflow:hidden}
.progress i{position:absolute;inset:0;border-radius:inherit;background:var(--progress-fill);transform-origin:0 50%;transform:scaleX(var(--p,0));transition:transform var(--dur-slow) var(--ease)}
.progress--indet i{transform:none;width:40%;animation:indet 1.3s var(--ease) infinite}
@keyframes indet{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
.fade-in{animation:chartIn var(--dur-slow) var(--ease) both}

/* ---------------------------------------------------------------- preview-only furniture */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:var(--gap);align-items:stretch}
.hero__title{font-family:var(--font-display);font-weight:var(--fw-display);font-size:var(--fs-hero);letter-spacing:var(--ls-hero);line-height:.95;margin:10px 0 0}
.hero__lead{color:var(--text-2);font-size:var(--fs-lead);max-width:52ch;margin:16px 0 0}
.hero__meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.appearance{display:grid;gap:8px;margin-top:22px;max-width:420px}
.appearance .note{margin:0}
/* theme switch: browsers with view transitions cross-fade natively; others get this veil in the old background colour */
.theme-veil{position:fixed;inset:0;z-index:300;pointer-events:none;transition:opacity .45s var(--ease)}
.theme-veil.is-out{opacity:0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.45s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.fxlist{display:grid;gap:4px}
.fxitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:10px 0;border-top:var(--bw) solid var(--hairline)}
.fxitem:first-child{border-top:0}
.fxitem b{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fxitem small{grid-column:1;color:var(--text-3);font-size:12.5px;line-height:1.45}
.fxitem .switch{grid-row:1/3;grid-column:2;padding:0}
.icons{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.icons .app-icon{box-shadow:var(--shadow-icon)}
.icons .i120{width:120px;height:120px;border-radius:calc(var(--r-icon) * 3.1)}
.icons .i76{width:76px;height:76px;border-radius:calc(var(--r-icon) * 2)}
.icons .i40{width:40px;height:40px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px 10px}
.sw{display:grid;gap:3px;font-size:11px;color:var(--text-3);min-width:0}
.sw span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw i{height:30px;margin-bottom:4px;border-radius:var(--r-control);border:var(--bw) solid var(--border)}
.sw b{color:var(--text-2);font-weight:600;font-family:var(--font-ui)}
.type-sample{display:grid;gap:6px}
.type-sample .d{font-family:var(--font-display);font-weight:var(--fw-display);font-size:34px;letter-spacing:var(--ls-display);line-height:1.05}
.type-sample .n{font-family:var(--font-num);font-size:30px;font-weight:var(--fw-num);letter-spacing:var(--ls-num);font-variant-numeric:tabular-nums lining-nums}
.phone-stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:center}
.phone{position:relative;width:300px;height:620px;border-radius:46px;padding:10px;background:var(--phone-body);box-shadow:var(--shadow-pop);flex:none}
.phone::before{content:"";position:absolute;top:18px;left:50%;width:84px;height:24px;margin-left:-42px;border-radius:14px;background:#000;z-index:2}

/* ---------- arithmetic */
const kcalAusMakros = (p, c, f) => p * 4 + c * 4 + f * 9;

function summe(items){
  const s = { kcal: 0, p: 0, c: 0, f: 0, n: 0 };
  (items || []).forEach(it => { const v = posten(it); s.kcal += v.kcal; s.p += v.p; s.c += v.c; s.f += v.f; s.n++; });
  return s;
}
function tag(iso){ return DATA.days[iso] || null; }
function tagSumme(iso){ const t = tag(iso); return summe(t ? t.items : []); }
function phaseVon(iso){
  const t = tag(iso); if (t && t.phase) return t.phase;

  for (const x of DATA.config.phaseFrom){ if (x.from <= iso) p = x.phase; else break; }

}
function zielVon(iso){ return DATA.config.targets[phaseVon(iso)] || ziel0(); }
function zielGesetzt(){ return PHASES.some(p => DATA.config.targets[p.id].kcal); }

function foodListe(){ return Object.keys(DATA.foods).map(id => Object.assign({ id }, DATA.foods[id])); }

/* usage across the log: count and last day, for "Recent" and sorting */
function gebrauch(){
  const g = {};
  Object.keys(DATA.days).sort().forEach(iso => DATA.days[iso].items.forEach(it => {
    if (!it.food) return; const x = g[it.food] || (g[it.food] = { n: 0, last: '', lastG: 0, lastMeal: '' });
    x.n++; if (iso >= x.last){ x.last = iso; x.lastG = it.g; x.lastMeal = it.meal; }

}
function eintraegeVon(foodId){ let n = 0; for (const iso in DATA.days) DATA.days[iso].items.forEach(it => { if (it.food === foodId) n++; }); return n; }

function treffer(f, q){

  if (/^\d{6,}$/.test(q.trim())) return f.barcode && f.barcode.indexOf(q.trim()) >= 0 ? 3 : 0;

function agg(sc){
  const r = { tage: [], geloggt: 0, kcal: 0, p: 0, c: 0, f: 0, imZiel: 0, mitZiel: 0, diffSumme: 0, proteinOk: 0, mitProteinZiel: 0,
    kalender: 0, phasen: { maintain: 0, shred: 0, surplus: 0 }, foods: {} };

function ringeSVG(groesse, rings){

/* kcal over budget: the second lap shades from the ring's blue into a muted amber (10 % over) and red (20 % over).
   The colour follows the position on the lap, so the tip always shows how far over the day is. Drawn as short
   pieces that fade in one after the other, which reads as the lap drawing on after the first one. */
/* the three steps come from the theme (--over-1/2/3), read when a ring is drawn */
let UEBER = [[0, [153, 190, 232]], [.10, [201, 154, 78]], [.20, [191, 98, 89]]];
function ueberStufen(){ try { UEBER = [[0, Kit.rgb(Kit.tok('--over-1'))], [.10, Kit.rgb(Kit.tok('--over-2'))], [.20, Kit.rgb(Kit.tok('--over-3'))]]; } catch (e){} }

function ueberBogen(mitte, r, breite, f2, v2, extra){

      ' d="M' + punkt(t0) + ' A' + r.toFixed(2) + ' ' + r.toFixed(2) + ' 0 0 1 ' + punkt(Math.max(ende, t0 + .0005)) + '"' +
      ' stroke="rgb(' + c.join(',') + ')" stroke-width="' + breite + '" stroke-linecap="' + (letzt || i === 0 ? 'round' : 'butt') + '"/>';

}

function zielBlock(phase, z){

function tagesRinge(iso, groesse){
  const s = tagSumme(iso), z = zielVon(iso), bs = bissFuer(iso), alt = bs ? bs.s : null, extra = bs ? BISS_DELAY / 1000 : 0;
  const rings = [{ frac: z.kcal ? s.kcal / z.kcal : 0, von: alt && z.kcal ? alt.kcal / z.kcal : 0, extra, breite: groesse > 150 ? 17 : 11, farbe: RING_E, warn: true }];
  if (z.protein) rings.push({ frac: s.p / z.protein, von: alt ? alt.p / z.protein : 0, extra, breite: groesse > 150 ? 13 : 8, farbe: RING_P });
  const rest = z.kcal ? z.kcal - s.kcal : null;
  const b = h('b', { class: 'zahl' }), small = h('small');
  if (rest === null){ small.textContent = 'kcal eaten'; }

  else { small.textContent = 'kcal over'; }
  const wert = rest === null ? s.kcal : Math.abs(rest);
  const box = h('div', { class: 'ringe', html: ringeSVG(groesse, rings) }, [h('div', { class: 'mitte' }, [b, small])]);

/* daily bars for a month, weekly averages for YTD; the dashed line is the target of each day (it follows the phases) */
function diagrammKarte(a, sc){
  const ytd = S.modus === 'ytd';
  const punkte = ytd ? wochen(a.tage).map(w => ({ label: w.mo, wert: w.wert, ziel: w.ziel, zukunft: w.zukunft, leer: !w.n, heute: w.mo === ISO(monday(P(S.tag))) }))
                     : a.tage.map(t => ({ label: t.iso, wert: t.s.kcal, ziel: t.z.kcal, zukunft: t.zukunft, leer: !t.geloggt, heute: t.iso === S.tag }));
  const karte = h('div', { class: 'glas card karte' }, [h('div', { class: 'kkopf' }, [
    h('div', {}, [h('h3', {}, [ytd ? 'Energy per week' : 'Energy per day']), h('p', { class: 'unter' }, [ytd ? 'Average kcal per logged day in each week' : 'kcal eaten each day'])])
  ])]);
  if (!a.geloggt){
    karte.appendChild(h('div', { class: 'leer-hinweis' }, [h('b', {}, ['Nothing logged in ' + (ytd ? S.jahr : MONTHS[S.monat]) + ' yet']), 'Scan or pick a food on Entry and it appears here.',
      h('div', { style: { marginTop: '14px' } }, [h('button', { type: 'button', class: 'btn btn--primary', onclick: () => { S.tag = TODAY; zeigeTab('entry'); } }, ['Go to Entry'])])]));
    return karte;
  }
  const W = 1000, H = 210, unten = 22, oben = 8, n = punkte.length;
  const max = Math.max(1, ...punkte.map(p => Math.max(p.wert, p.ziel || 0))) * 1.08;
  const y = v => oben + (H - unten - oben) * (1 - v / max);
  const sp = W / n, bw = Math.max(3, Math.min(26, sp * .62));
  const NSV = 'http://www.w3.org/2000/svg';
  let s = '<defs><linearGradient id="stabg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--bar-1)"/><stop offset="1" style="stop-color:var(--bar-2)"/></linearGradient>' +
    '<linearGradient id="stabh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--bar-today-1)"/><stop offset="1" style="stop-color:var(--bar-today-2)"/></linearGradient></defs>';
  /* gridlines */
  const schritt = max > 6000 ? 2000 : (max > 2500 ? 1000 : 500);
  for (let v = schritt; v < max; v += schritt) s += '<line x1="0" x2="' + W + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" style="stroke:var(--chart-grid)"/><text class="achse" x="' + W + '" y="' + (y(v) - 4).toFixed(1) + '" text-anchor="end">' + tsd(v) + '</text>';
  punkte.forEach((p, i) => {
    const x = i * sp + (sp - bw) / 2;
    if (!p.leer){
      const hgt = Math.max(2, H - unten - y(p.wert));
      s += '<rect class="stab" style="animation-delay:' + (i * (ytd ? .012 : .018)).toFixed(3) + 's" x="' + x.toFixed(1) + '" y="' + y(p.wert).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hgt.toFixed(1) + '" rx="' + Math.min(6, bw / 2).toFixed(1) + '" fill="url(#' + (p.heute ? 'stabh' : 'stabg') + ')"><title>' +
        (ytd ? 'Week of ' + tagKurz(p.label) + ': ' + tsd(p.wert) + ' kcal per day' : tagLang(p.label) + ': ' + tsd(p.wert) + ' kcal') + (p.ziel ? ' (target ' + tsd(p.ziel) + ')' : '') + '</title></rect>';
    } else if (!p.zukunft){
      s += '<rect x="' + (x + bw / 2 - 1.5).toFixed(1) + '" y="' + (H - unten - 3) + '" width="3" height="3" rx="1.5" style="fill:var(--bar-empty)"/>';
    }
    const heuteI = punkte.findIndex(x => x.heute), abst = TOUCH || W / n < 40 ? 7 : 3;
    const zeig = ytd ? (P(p.label).getUTCDate() <= 7) : (p.heute || ((n <= 16 || i % abst === 0) && (heuteI < 0 || Math.abs(i - heuteI) > (abst > 3 ? 2 : 1))));
    if (zeig) s += '<text class="achse" x="' + (i * sp + sp / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle"' + (p.heute ? ' style="fill:var(--text);font-weight:600"' : '') + '>' +
      (ytd ? MSHORT[P(p.label).getUTCMonth()] : String(P(p.label).getUTCDate())) + '</text>';
  });
  /* target as a step line, broken where there is none */
  let pfad = '', an = false;
  punkte.forEach((p, i) => {
    if (!p.ziel || p.zukunft){ an = false; return; }
    const x0 = i * sp, x1 = (i + 1) * sp, yy = y(p.ziel).toFixed(1);
    pfad += (an ? 'L' + x0.toFixed(1) + ',' + yy : 'M' + x0.toFixed(1) + ',' + yy) + 'L' + x1.toFixed(1) + ',' + yy; an = true;
  });
  if (pfad) s += '<path class="ziellinie" d="' + pfad + '"/>';
  const box = h('div', { class: 'diagramm' });
  box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="' + (ytd ? 'Average kcal per week' : 'kcal per day') + '">' + s + '</svg>';
  /* text must not stretch with the bars: counter-scale it */
  const svgEl = box.firstChild;
  requestAnimationFrame(() => {
    const bw2 = svgEl.getBoundingClientRect ? svgEl.getBoundingClientRect().width : 0;
    if (!bw2) return;
    const fx = W / bw2;
    $$('text', svgEl).forEach(t => { const x = Number(t.getAttribute('x')); t.setAttribute('transform', 'translate(' + x + ' 0) scale(' + fx.toFixed(3) + ' 1) translate(' + (-x) + ' 0)'); });
  });
  karte.appendChild(box);
  karte.appendChild(h('div', { class: 'legende' }, [
    h('span', {}, [h('i', { style: { background: 'linear-gradient(var(--bar-1),var(--bar-2))' } }), ytd ? 'Average per logged day' : 'Eaten']),
    pfad ? h('span', {}, [h('i', { class: 'strich' }), 'Target of the day\u2019s phase']) : null,
    h('span', {}, [h('i', { style: { background: 'linear-gradient(var(--bar-today-1),var(--bar-today-2))' } }), ytd ? (S.tag === TODAY ? 'This week' : 'Week of ' + tagKurz(S.tag)) : (S.tag === TODAY ? 'Today' : tagKurz(S.tag))])
  ]));
  return karte;
}

/* ---------- the log sheet: amount (portions or grams), meal, live numbers. Also edits a logged item.
   Portion mode: type how many pieces (6 cookies), the grams follow from the food's portion size.
   Gram mode: type the full grams or ml as weighed; the label values are per 100, the sheet does the maths. */
function logSheet(food, opt){
  opt = opt || {};
  const it = opt.item, iso = opt.iso || S.tag, use = gebrauch();
  const quelle = it ? { name: it.name, brand: it.brand || '', k: it.k, p: it.p, c: it.c, f: it.f, unit: food ? food.unit : 'g', portion: food ? food.portion : null } : food;
  if (!quelle) return;
  let meal = it ? it.meal : (opt.meal || standardMahlzeit());
  const pg = quelle.portion && quelle.portion.g > 0 ? quelle.portion.g : 0;
  const pName = pg ? (/[a-zA-Z\u00c0-\u024f]/.test(quelle.portion.name) ? quelle.portion.name : 'Portion') : '';
  const glatt = n => Math.abs(n * 4 - Math.round(n * 4)) < 0.01;          /* whole, half or quarter portions */
  const zahlText = x => String(Math.round(x * 100) / 100);
  const vorG = it ? it.g : (opt.g > 0 ? opt.g : 0);
  const startG = vorG || (use[food.id] && use[food.id].lastG ? use[food.id].lastG : (pg || 100));
  /* portions whenever the food has a size, unless an edited or copied entry was weighed to an odd amount */
  let art = pg && (!vorG || glatt(vorG / pg)) ? 'portion' : 'g';
  const startWert = art === 'portion' ? (glatt(startG / pg) ? startG / pg : 1) : startG;
  const gIn = h('input', { type: 'text', inputmode: 'decimal', value: zahlText(startWert), 'aria-label': 'Amount', enterkeyhint: 'done', autocomplete: 'off' });
  const einh = h('em', {}, [art === 'portion' ? pName : quelle.unit]);
  const feld = h('div', { class: 'gramm' }, [gIn, einh]);
  const umrech = h('div', { class: 'umrech' });
  const kopf = h('div', { class: 'k' }, [art === 'portion' ? 'How many' : 'Amount']);
  const kachel = h('div', { class: 'mengenkachel', onclick: e => { if (e.target !== gIn){ gIn.focus(); gIn.select(); } } }, [
    kopf, h('span', { class: 'stift', html: icon('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>', 15) }), feld, umrech
  ]);
  const vor = h('div', { class: 'vorschau' });
  const gramm = () => { const v = zahlLesen(gIn.value) || 0; return Math.round((art === 'portion' ? v * pg : v) * 10) / 10; };
  const malVor = () => {
    const g = gramm(), x = g / 100, v = zahlLesen(gIn.value) || 0;
    gIn.style.width = Math.max(1.6, gIn.value.length + .4) + 'ch';      /* the unit sits right next to the number */
    vor.innerHTML = '';
    [['kcal', quelle.k * x, true], ['Protein', quelle.p * x], ['Carbs', quelle.c * x], ['Fat', quelle.f * x]].forEach(([n, w, k]) =>
      vor.appendChild(h('div', {}, [h('b', {}, [k ? tsd(w) : g1(w)]), h('small', {}, [k ? n : n + ' g'])])));
    if (art === 'portion') umrech.innerHTML = esc(zahlText(v)) + ' \u00d7 ' + esc(g1(pg)) + ' ' + quelle.unit + ' = <b>' + esc(g1(g)) + ' ' + quelle.unit + '</b>';
    else umrech.textContent = pg ? '1 ' + pName + ' = ' + g1(pg) + ' ' + quelle.unit : 'Full amount, e.g. 150 for 150 ' + quelle.unit;
    los.disabled = !(g > 0);
  };
  /* switching keeps the same amount of food: 6 pieces become 114 g and back */
  const wechsle = neu => {
    if (neu === art) return;
    const g = gramm(); art = neu;
    gIn.value = g > 0 ? zahlText(art === 'portion' ? g / pg : g) : '';
    einh.textContent = art === 'portion' ? pName : quelle.unit;
    kopf.textContent = art === 'portion' ? 'How many' : 'Amount';
    feld.classList.remove('wechsel'); void feld.offsetWidth; feld.classList.add('wechsel');
    malVor();
    if (!TOUCH){ gIn.focus(); gIn.select(); }
  };
  const artWahl = pg ? h('div', { class: 'mengenart' }, [segment([['portion', pName], ['g', quelle.unit === 'ml' ? 'Millilitres' : 'Grams']], art, wechsle)]) : null;
  const los = h('button', { type: 'button', class: 'btn btn--primary' }, [it ? 'Save' : 'Add to ' + meal]);
  const mahl = segment(MEALS.map(m => [m, m === 'Breakfast' ? 'Breakfast' : m]), meal, m => { meal = m; if (!it) los.textContent = 'Add to ' + m; });
  gIn.onkeydown = e => { if (e.key === 'Enter' && !los.disabled) los.click(); };
  gIn.oninput = malVor;
  gIn.onfocus = () => setTimeout(() => gIn.select(), 0);   /* typing replaces the amount */
  const body = h('div', {}, [
    artWahl,
    kachel,
    vor,
    h('div', { class: 'mahlwahl' }, [mahl]),
    h('div', { class: 'aktion' }, [
      it ? h('button', { type: 'button', class: 'btn btn--quiet-danger links', onclick: () => {
        d.zu(); postenLoeschen(iso, it);
      } }, ['Remove']) : null,
      los
    ])
  ]);
  los.onclick = () => {
    const g = gramm(); if (!(g > 0)) return;
    if (it){ it.g = g; it.meal = meal; d.zu(); aendern(); neuId = it.id; malSeite(); toast('Updated', false, it.name + ', ' + g1(g) + ' ' + quelle.unit); return; }
    const t = DATA.days[iso] || (DATA.days[iso] = { items: [] });
    const neu = { id: neueId(), food: food.id || null, name: food.name, brand: food.brand || '', g, meal, k: food.k, p: food.p, c: food.c, f: food.f, at: new Date().toISOString() };
    bissVorbereiten(iso); t.items.push(neu);
    d.zu(); aendern(); neuId = neu.id; S.suche = '';
    if (S.tab !== 'entry'){ S.tag = iso; zeigeTab('entry'); } else seiteEntry();
    gebucht(neu, iso);
  };
  malVor();
  const d = blatt(quelle.name, (quelle.brand ? quelle.brand + '. ' : '') + tsd(quelle.k) + ' kcal per 100 ' + quelle.unit + (it ? '. Logged on ' + tagKurz(iso) + '.' : ''), body, { fokus: TOUCH ? null : 'input' });
}

/* ================================================================ scanning: photo -> code -> your food
   ziel: 'log' (Entry: log the food), 'food' (Foods: open the food), or a function that receives the code (a form field). */
function scanStarten(ziel, quelle){
  const inp = $(quelle === 'datei' ? '#fotowahl' : '#kamera');
  inp.value = '';

  inp.click();

function bildLaden(datei){
  return new Promise((ok, nein) => {
    const u = URL.createObjectURL(datei), img = new Image();
    img.onload = () => ok({ img, u });
    img.onerror = () => { URL.revokeObjectURL(u); nein(new Error('This file is not a picture the browser can open.')); };
    img.src = u;
  });
}
/* grey pixels at a given size (photos arrive upright: browsers apply the camera's orientation when drawing) */
function grauBild(img, maxSeite){
  const f = Math.min(1, maxSeite / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * f)), hh = Math.max(1, Math.round(img.naturalHeight * f));
  const c = document.createElement('canvas'); c.width = w; c.height = hh;
  const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0, w, hh);
  return { grau: grauVon(g.getImageData(0, 0, w, hh).data, w * hh), w, h: hh };
}
/* the middle of the photo first (where people aim), then the whole picture at two sizes */
function codeSuchen(img){
  const versuche = [[1280, null], [1800, .55], [820, null], [2400, .4]];
  for (const [max, ausschnitt] of versuche){
    let b = grauBild(img, max);
    if (ausschnitt){
      const w = Math.round(b.w * ausschnitt), hh = Math.round(b.h * ausschnitt), x0 = (b.w - w) >> 1, y0 = (b.h - hh) >> 1, g = new Uint8Array(w * hh);
      for (let y = 0; y < hh; y++) g.set(b.grau.subarray((y + y0) * b.w + x0, (y + y0) * b.w + x0 + w), y * w);
      b = { grau: g, w, h: hh };
    }
    const r = eanBild(b.grau, b.w, b.h);
    if (r) return r.code;
  }
  return null;
}
async function fotoLesen(datei, ziel){
  const lade = h('div', { class: 'lade' }, [h('div', { class: 'spinner' }), h('span', {}, ['Reading the barcode\u2026'])]);
  const d = blatt('Scan', null, lade);
  let geladen;
  try { geladen = await bildLaden(datei); } catch (e){ d.zu(); toast(e.message, true); return; }
  await new Promise(r => setTimeout(r, 40));            /* let the sheet paint before the work starts */
  let code = null;
  try { code = codeSuchen(geladen.img); } catch (e){ code = null; }
  if (code){ URL.revokeObjectURL(geladen.u); d.zu(); codeGefunden(code, ziel); return; }
  /* nothing found: show the photo, offer a retake or typing */
  const body = h('div', {}, [
    h('img', { class: 'foto', src: geladen.u, alt: 'Your photo' }),
    h('p', { class: 'hinweis' }, ['No barcode found in this photo. Hold the phone parallel to the pack, close enough that the code fills about half the width, and keep it sharp.']),
    h('div', { class: 'aktion' }, [
      h('button', { type: 'button', class: 'btn btn--secondary', onclick: () => { d.zu(); codeTippen(ziel); } }, ['Type the number']),
      h('button', { type: 'button', class: 'btn btn--primary', onclick: () => { d.zu(); scanStarten(ziel); } }, ['Take another photo'])
    ])
  ]);
  d.box.querySelector('.lade').replaceWith(body);
  d.box.querySelector('h2').textContent = 'Could not read it';
}
function codeGueltig(c){
  if (/^\d{12}$/.test(c)) c = '0' + c;
  if (!/^(\d{8}|\d{13})$/.test(c)) return null;
  return eanPruef(c.split('').map(Number)) ? c : null;
}
function codeTippen(ziel){
  const inp = h('input', { type: 'text', inputmode: 'numeric', placeholder: 'The digits under the bars', autocomplete: 'off', class: 'code', enterkeyhint: 'done' });
  const hinweis = h('p', { class: 'hinweis', hidden: true });
  const ok = h('button', { type: 'button', class: 'btn btn--primary' }, ['Use this code']);
  const pruefe = () => {
    const roh = inp.value.replace(/\D/g, ''), c = codeGueltig(roh);
    if (c){ d.zu(); codeGefunden(c, ziel); return; }
    hinweis.hidden = false;
    hinweis.textContent = roh.length === 8 || roh.length === 12 || roh.length === 13 ? 'The check digit does not match. One of the digits is probably mistyped.' : 'A barcode on food has 8 or 13 digits (12 on some imports).';
  };
  ok.onclick = pruefe; inp.onkeydown = e => { if (e.key === 'Enter') pruefe(); };
  const body = h('div', {}, [h('label', { class: 'feld' }, [h('span', {}, ['Barcode']), inp]), hinweis, h('div', { class: 'aktion' }, [ok])]);
  const d = blatt('Type the barcode', 'All digits, including the small ones at the edges.', body, { fokus: 'input' });
}
function codeGefunden(code, ziel){
  if (typeof ziel === 'function') return ziel(code);
  const f = foodNachCode(code);
  if (f){ if (ziel === 'food') foodEditor(f); else logSheet(f); return; }
  foodEditor({ barcode: code, made: 'scan' }, { danach: ziel === 'log' ? 'log' : null, neuGescannt: true });
}

/* ---------- the food form. Values per 100 g (or ml), straight from the label. */
function foodEditor(f, opt){
  opt = opt || {};

  };

  const zahl = { inputmode: 'decimal', placeholder: '0', autocomplete: 'off' };
  const k = feld('Energy', e.k, zahl, 'kcal'), p = feld('Protein', e.p, zahl, 'g'), c = feld('Carbs', e.c, zahl, 'g'), fe = feld('Fat', e.f, zahl, 'g');
  const pName = feld('Portion name', e.portion ? e.portion.name : '', { placeholder: 'e.g. cup, slice', autocomplete: 'off' });
  const pG = feld('Portion size', e.portion ? e.portion.g : '', zahl, e.unit);
  const fav = h('input', { type: 'checkbox', checked: e.fav ? 'checked' : null, role: 'switch' });
  const pruef = h('div');
  const pro = h('div', { class: 'unterkopf', style: { margin: '10px 2px 8px' } }, [h('span', {}, ['Per 100 ' + e.unit + ', as on the label'])]);
  const einheit = segment([['g', 'Per 100 g'], ['ml', 'Per 100 ml']], e.unit, u => { e.unit = u; pro.firstChild.textContent = 'Per 100 ' + u + ', as on the label'; pG.el.querySelector('em').textContent = u; });
  const scanKlein = h('button', { type: 'button', class: 'chip chip--filter', style: { alignSelf: 'end', marginBottom: '12px', height: '48px', borderRadius: 'var(--r-control)' }, 'aria-label': 'Scan the barcode', html: icon(IC.scan, 18),
    onclick: () => scanStarten(cd => { code.inp.value = cd; pruefen(); }) });

  /* plausibility, said once and plainly: kJ typed as kcal, label kcal far from the macros */
  let behalten = null;                                            /* label kcal you confirmed despite the gap */
  const abweichung = (kv, ausM) => Math.abs(kv - ausM) > Math.max(3, kv * .02);
  function pruefen(){
    pruef.innerHTML = '';
    const kv = zahlLesen(k.inp.value), pv = zahlLesen(p.inp.value) || 0, cv = zahlLesen(c.inp.value) || 0, fv = zahlLesen(fe.inp.value) || 0;

      /* more than 2 % apart (3 kcal minimum, for rounding on light foods): saving waits until you pick one */
      const proz = Math.round(Math.abs(kv - ausM) / kv * 100);
      if (behalten === kv) pruef.appendChild(h('p', { class: 'hinweis ruhig' }, ['Label value ' + tsd(kv) + ' kept. The macros give ' + tsd(ausM) + ' kcal (' + proz + ' % apart).']));
      else pruef.appendChild(h('p', { class: 'hinweis warn' }, [
        'The macros add up to ' + tsd(ausM) + ' kcal, the label says ' + tsd(kv) + ': ' + proz + ' % apart. Check the numbers for a typo. Fibre (2 kcal/g) or alcohol (7 kcal/g) can explain a real gap.',
        h('div', { class: 'knoepfe' }, [
          h('button', { type: 'button', class: 'haupt', onclick: () => { k.inp.value = String(Math.round(ausM)); pruefen(); } }, ['Use ' + tsd(ausM)]),
          h('button', { type: 'button', onclick: () => { behalten = kv; pruefen(); } }, ['Keep ' + tsd(kv)])
        ])]));
    }
    if (pv + cv + fv > 100.5) pruef.appendChild(h('p', { class: 'hinweis' }, ['Protein, carbs and fat add up to more than 100 g per 100 ' + e.unit + '. One of them is off.']));
    const cd = code.inp.value.replace(/\D/g, '');
    if (cd && !codeGueltig(cd)) pruef.appendChild(h('p', { class: 'hinweis' }, ['This barcode does not pass its check digit. Rescan it or check the digits.']));
    else if (cd){ const da = foodNachCode(codeGueltig(cd)); if (da && da.id !== f.id) pruef.appendChild(h('p', { class: 'hinweis' }, ['This barcode already belongs to ' + da.name + '.'])); }
    const offen = kv !== null && kv <= 900 && ausM > 0 && abweichung(kv, ausM) && behalten !== kv;
    speichernBtn.disabled = !name.inp.value.trim() || (kv === null && !(ausM > 0)) || offen;
  }
  [k, p, c, fe, code, name].forEach(x => x.inp.addEventListener('input', pruefen));

  const speichernBtn = h('button', { type: 'button', class: 'btn btn--primary' }, [opt.danach === 'log' ? 'Save and log' : 'Save']);
  speichernBtn.onclick = () => {
    const kv = zahlLesen(k.inp.value), pv = zahlLesen(p.inp.value) || 0, cv = zahlLesen(c.inp.value) || 0, fv = zahlLesen(fe.inp.value) || 0;
    const cd = codeGueltig(code.inp.value.replace(/\D/g, '')) || '';
    const da = cd && foodNachCode(cd);
    if (da && da.id !== f.id){ toast('That barcode already belongs to ' + da.name + '.', true); return; }
    const pgv = zahlLesen(pG.inp.value);
    const werte = { name: name.inp.value.trim(), brand: brand.inp.value.trim(), barcode: cd, unit: e.unit,
      k: kv === null ? Math.round(kcalAusMakros(pv, cv, fv)) : kv, p: pv, c: cv, f: fv,
      portion: pgv > 0 ? { name: pName.inp.value.trim() || 'Portion', g: pgv } : null, fav: fav.checked };
    if (werte.k > 1000 || pv > 100 || cv > 100 || fv > 100){ toast('Values are per 100 ' + e.unit + ': kcal up to 900, each macro up to 100 g.', true); return; }
    const jetzt = new Date().toISOString();
    if (neu){
      const id = neueId();
      DATA.foods[id] = Object.assign({}, werte, { made: f.made === 'scan' || opt.neuGescannt ? 'scan' : 'manual', created: jetzt, updated: jetzt });
      d.zu(); aendern();
      const gespeichert = Object.assign({ id }, DATA.foods[id]);
      if (opt.danach === 'log') logSheet(gespeichert, opt.logOpt);
      else { malSeite(); toast('Added ' + werte.name, false, werte.barcode ? 'Scan it next time and it is ready.' : null); }
      return;
    }
    const alt = DATA.foods[f.id], werteGeaendert = ['k', 'p', 'c', 'f'].some(x => Math.abs((alt[x] || 0) - werte[x]) > 1e-9);
    const nameGeaendert = alt.name !== werte.name || (alt.brand || '') !== werte.brand;
    const anwenden = (auchVergangenheit) => {
      DATA.foods[f.id] = Object.assign({}, alt, werte, { updated: jetzt });
      let n = 0;
      for (const iso in DATA.days) DATA.days[iso].items.forEach(it => {
        if (it.food !== f.id) return;
        if (nameGeaendert){ it.name = werte.name; it.brand = werte.brand; }
        if (auchVergangenheit && werteGeaendert){ it.k = werte.k; it.p = werte.p; it.c = werte.c; it.f = werte.f; n++; }
      });
      d.zu(); aendern(); malSeite();
      toast('Saved ' + werte.name, false, n ? plural(n, 'logged entry', 'logged entries') + ' updated too.' : null);
    };
    const nE = eintraegeVon(f.id);
    if (werteGeaendert && nE){
      bestaetigen({ titel: 'Update logged entries too?', text: werte.name + ' is in ' + plural(nE, 'logged entry', 'logged entries') + '. They keep the old values unless you update them, for example to fix a typo.',
        nein: 'Only from now on', beiNein: () => anwenden(false), jaText: 'Update ' + plural(nE, 'entry', 'entries'), ja: () => anwenden(true) });
    } else anwenden(false);
  };

  const body = h('div', {}, [
    opt.neuGescannt ? h('p', { class: 'hinweis' }, ['New barcode ', h('span', { class: 'code' }, [e.barcode]), '. Type the values from the label once; next time this code is all it takes.']) : null,
    name.el,
    brand.el,
    h('div', { style: { display: 'grid', gridTemplateColumns: '1fr auto', gap: '8px' } }, [code.el, scanKlein]),
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '10px', flexWrap: 'wrap' } }, [pro, einheit]),
    h('div', { class: 'felder4' }, [k.el, p.el, c.el, fe.el]),
    pruef,
    h('div', { class: 'felder2' }, [pName.el, pG.el]),
    h('label', { class: 'switch einzeln' }, [h('span', {}, [h('b', {}, ['Favourite']), h('small', {}, ['Shown at the top on Entry'])]), fav]),
    h('div', { class: 'aktion' }, [
      !neu ? h('button', { type: 'button', class: 'btn btn--quiet-danger links', onclick: () => {
        const nE = eintraegeVon(f.id);
        bestaetigen({ titel: 'Delete ' + f.name + '?', text: nE ? 'Its ' + plural(nE, 'logged entry', 'logged entries') + ' stay in your log with their values. Only the food disappears from this list.' : 'It is not in your log anywhere.',
          gefahr: true, jaText: 'Delete food', ja: () => { delete DATA.foods[f.id]; for (const iso in DATA.days) DATA.days[iso].items.forEach(it => { if (it.food === f.id) it.food = null; }); d.zu(); aendern(); malSeite(); toast('Deleted ' + f.name); } });
      } }, ['Delete']) : null,
      !neu && opt.danach !== 'log' ? h('button', { type: 'button', class: 'btn btn--secondary', onclick: () => { d.zu(); S.tag = S.tab === 'entry' ? S.tag : TODAY; logSheet(Object.assign({ id: f.id }, DATA.foods[f.id]), { iso: S.tag }); } }, ['Log it']) : null,
      speichernBtn
    ])
  ]);
  const d = blatt(neu ? (opt.neuGescannt ? 'New food' : 'Add a food') : 'Edit food', neu ? null : (f.made === 'scan' ? 'Added by scanning' : 'Added by hand') + (f.created ? ' on ' + tagKurz(f.created.slice(0, 10)) : ''), body,
    { fokus: TOUCH ? null : (e.name ? '.felder4 input' : 'input') });
  pruefen();
}

/* ================================================================ the posting moment: small, because it happens several times a day */
const SPRUECHE = [
  ['Posted.', 'Debit stomach, credit fridge.'],
  ['Booked.', 'Accrued, not deferred.'],
  ['Entry approved.', 'Reconciled with the plate.'],
  ['Recognised in full.', 'No provision for second helpings.'],
  ['Logged.', 'The audit trail is delicious.'],
  ['Journal entry posted.', 'Materiality: one plate.'],
  ['Booked.', 'Four-eyes principle: you and the label.'],
  ['Posted to the ledger.', 'Fairly presented, in all material respects.'],
  ['Cleared.', 'No open items on this plate.'],
  ['Booked.', 'Supported by documentation (the packaging).']
];
let letzterSpruch = -1;
function gebucht(neu, iso){
  let i; do { i = Math.floor(Math.random() * SPRUECHE.length); } while (i === letzterSpruch && SPRUECHE.length > 1);
  letzterSpruch = i;
  const v = posten(neu), s = tagSumme(iso), z = zielVon(iso), vorher = s.p - v.p;
  let [a, b] = SPRUECHE[i];
  if (z.protein && vorher < z.protein && s.p >= z.protein){ a = 'Protein target reached.'; b = 'Fully funded for ' + (iso === TODAY ? 'today' : tagKurz(iso)) + '.'; }
  toast(a + ' ' + neu.name + ', ' + tsd(v.kcal) + ' kcal', false, b);
  plusFliegt(v.kcal);
}
/* THE BITE (signature): the kcal fly from where you tapped into the day's ring, the ring swallows them with a pulse
   and its arcs grow from the old total to the new one. Glass sends an ice droplet, Ember a spark, Prism a beam.
   Switched off (or with reduced motion), the classic "+312" rises over the ring instead. */
let BISS = null, LAST_TAP = null;
const BISS_DELAY = 820, BISS_START = 140, BISS_FLUG = 640;
document.addEventListener('pointerdown', e => { LAST_TAP = { x: e.clientX, y: e.clientY, t: Date.now() }; }, true);
function bissVorbereiten(iso){ BISS = BEWEGUNG && Kit.isOn('bite') ? { iso, s: tagSumme(iso), t: Date.now() } : null; }
function bissFuer(iso){ return BISS && BISS.iso === iso && Date.now() - BISS.t < 2500 ? BISS : null; }
function plusFliegt(kcal){
  const bs = BISS; BISS = null;
  if (!BEWEGUNG) return;
  const ring = $('#p-entry .tagsumme .ringe'), r = ring && ring.getBoundingClientRect();
  const sichtbar = !!(r && r.width && r.bottom > 40 && r.top < window.innerHeight - 40);
  if (bs && sichtbar){ try { biss(kcal, ring, r); return; } catch (e){ /* decoration only: fall back to the classic */ } }
  setTimeout(() => {
    let x, y;
    if (sichtbar){ x = r.left + r.width / 2; y = r.top + r.height * .25; }
    else { const t = LAST_TAP && Date.now() - LAST_TAP.t < 4000 ? LAST_TAP : { x: window.innerWidth / 2, y: window.innerHeight * .6 }; x = t.x; y = t.y - 20; }
    const el = h('div', { class: 'plus' }, ['+' + tsd(kcal)]);
    el.style.left = x + 'px'; el.style.top = y + 'px';
    document.body.appendChild(el); setTimeout(() => el.remove(), 1400);
  }, 260);
}
function biss(kcal, ring, r){
  const tap = LAST_TAP && Date.now() - LAST_TAP.t < 4000 ? LAST_TAP : { x: window.innerWidth / 2, y: window.innerHeight * .8 };
  const x0 = tap.x, y0 = tap.y, x1 = r.left + r.width / 2, y1 = r.top + r.height / 2;
  /* a gentle arc: the control point sits above the straight line */
  const cx = (x0 + x1) / 2, cy = Math.min(y0, y1) - Math.max(50, Math.abs(x1 - x0) * .22 + Math.abs(y1 - y0) * .12);
  const pt = t => [(1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * cx + t * t * x1, (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * cy + t * t * y1];
  const N = 10, a = Math.atan2(y1 - y0, x1 - x0) * 180 / Math.PI;
  const bahn = (gr, op) => { const f = []; for (let i = 0; i <= N; i++){ const t = i / N, p = pt(t);
    f.push({ transform: 'translate3d(' + p[0].toFixed(1) + 'px,' + p[1].toFixed(1) + 'px,0) scale(' + (gr * (i === 0 ? .4 : 1 - t * .45)).toFixed(3) + ')', opacity: i === 0 || i === N ? 0 : op }); } return f; };
  const flieg = (cls, gr, op, spaeter, label) => {
    const el = h('div', { class: 'biss' + cls }, [h('i'), label ? h('b', {}, ['+' + tsd(kcal)]) : null]);
    el.style.setProperty('--a', a.toFixed(1) + 'deg'); el.style.opacity = '0';
    document.body.appendChild(el);
    const an = el.animate(bahn(gr, op), { duration: BISS_FLUG, delay: BISS_START + spaeter, easing: 'cubic-bezier(.45,.05,.35,1)', fill: 'both' });
    an.onfinish = () => el.remove(); setTimeout(() => el.remove(), BISS_START + spaeter + BISS_FLUG + 400);
  };
  flieg(' geist', .55, .25, 90, false);
  flieg(' geist', .75, .5, 45, false);
  flieg('', 1, 1, 0, kcal >= 1);
  setTimeout(() => {
    if (!ring.isConnected) return;
    ring.classList.remove('schluck'); void ring.offsetWidth; ring.classList.add('schluck');
    const w = h('span', { class: 'welle', 'aria-hidden': 'true' }); ring.appendChild(w);
    setTimeout(() => { w.remove(); ring.classList.remove('schluck'); }, 950);
  }, BISS_START + BISS_FLUG - 40);
}

/* DAY LEVEL (optional extra): the background fills like a glass with the day's kcal; a fine line marks the target
   at 78 % of the screen, and the colour warms once the day is past it. Entry follows the day you look at. */
function pegel(){
  const el = $('#pegel'); if (!el) return;
  const an = !!DATA && !$('#shell').hidden && Kit.isOn('daylevel');
  el.classList.toggle('an', an);
  if (!DATA) return;
  const iso = S.tab === 'foods' ? TODAY : S.tag, z = zielVon(iso), bs = bissFuer(iso);
  const setze = s => {
    const p = z.kcal ? s.kcal / z.kcal : 0, L = Math.min(1.12, p) * .78;
    el.classList.toggle('ohneziel', !z.kcal); el.classList.toggle('ueber', !!z.kcal && p > 1);
    $('.pegel__fill', el).style.transform = 'translate3d(0,' + ((1 - L) * 100).toFixed(2) + '%,0)';
  };
  if (bs && an){ setze(bs.s); setTimeout(() => setze(tagSumme(iso)), BISS_DELAY); }
  else setze(tagSumme(iso));
}
const SPRUECHE_KOPIE = [
  ['Recurring entry posted.', 'Same as last period. The auditor approves.'],
  ['Prior-period template applied.', 'Consistency principle, honoured.'],
  ['Standing order executed.', 'Your stomach has a direct debit.'],
  ['Rolled forward.', 'Opening balance = closing balance. Textbook.']
];

/* ================================================================ boot */
Kit.init({
  app: 'calorie-tracker', defaultTheme: 'ember', icon: appIcon,
  toolEffects: [
    { id: 'bite', kind: 'signature', tool: 'CICO', name: 'The bite', desc: 'Logged kcal fly into the day\u2019s ring; the ring swallows them with a pulse and its arc grows from the old total to the new one. Glass sends an ice droplet, Ember a spark, Prism a beam of light.' },
    { id: 'daylevel', kind: 'extra', tool: 'CICO', name: 'Day level', desc: 'The background fills like a glass as the day\u2019s kcal rise. A fine line marks the target, and the colour warms once you are past it. Takes the place of the theme\u2019s ambient light here.' }
  ],
  /* a new look: the page is redrawn quietly (no replayed animations), so colours drawn by code follow too */
  onTheme: (id, first) => { if (!first && DATA && !$('#shell').hidden){ RUHIG = true; try { malSeite(); } finally { RUHIG = false; } } pegel(); },
  onEffect: id => { if (id === 'daylevel') pegel(); },
  toast: (m, o) => toast(m, !!(o && o.type === 'error'), o && o.sub)
});
Kit.initDropdowns('select.select');
/* the chart's labels are fitted to its width: redraw on a real width change only (the iPhone fires resize
   whenever the address bar slides in or out), and quietly, without replaying the animations */
let resizeT = null, breite = window.innerWidth;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (window.innerWidth === breite) return;
    breite = window.innerWidth;
    if (DATA && S.tab === 'overview'){ RUHIG = true; try { seiteOverview(); } finally { RUHIG = false; } }
  }, 250);
});
/* a tab left open over midnight moves on to the new day */
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !DATA) return;
  const neu = lokalHeute(); if (neu === TODAY) return;
  if (S.tag === TODAY) S.tag = neu;
  TODAY = neu; malSeite();
});
/* hosted (GitHub Pages): home-screen icon, manifest and the offline cache. Opened as a local file, none of this
   is loaded, and the app works exactly the same. */
const GEHOSTET = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
if (GEHOSTET){
  document.head.appendChild(h('link', { rel: 'manifest', href: 'manifest.webmanifest' }));
  if ('serviceWorker' in navigator){
    const hatteSchon = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hatteSchon) toast('A new version is ready.', false, 'Close and reopen the app to use it.'); });
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
zeigeStart();
})();
